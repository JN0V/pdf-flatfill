# End-to-end tests of the web app, plus the compatibility loop with the CLI:
# the TOML the web app exports must be accepted verbatim by fill-pdf.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: tests/e2e
        run: npx playwright test

      # The loop is closed with the Python engine: the description the web
      # app exported during the tests must pass fill-pdf verbatim.
      - name: CLI accepts the exported TOML
        run: |
          pip install pymupdf
          bin/fill-pdf tests/e2e/.artifacts/formulaire.toml --dry-run
          # The custom-font description exists unless the suite ran offline.
          if [ -f tests/e2e/.artifacts/formulaire-font.toml ]; then
            bin/fill-pdf tests/e2e/.artifacts/formulaire-font.toml --dry-run
          fi

      # The self-contained loop: fill for real with --embed, unpack the
      # output into an empty directory, and the description, source and
      # assets must come back byte-identical.
      - name: CLI embeds and unpacks the description
        run: |
          bin/fill-pdf tests/e2e/.artifacts/formulaire.toml --force --embed
          mkdir /tmp/unpacked
          bin/fill-pdf --unpack tests/e2e/.artifacts/formulaire-rempli.pdf -C /tmp/unpacked
          cmp tests/e2e/.artifacts/formulaire.toml /tmp/unpacked/formulaire.toml
          cmp tests/e2e/.artifacts/formulaire.pdf /tmp/unpacked/formulaire.pdf
          cmp tests/e2e/.artifacts/signature.png /tmp/unpacked/signature.png

      # Crossed the other way: the self-contained PDF the WEB app generated
      # during the suite must unpack with the CLI into a valid description.
      - name: CLI unpacks the web app's self-contained PDF
        run: |
          mkdir /tmp/unpacked-web
          bin/fill-pdf --unpack tests/e2e/.artifacts/embedded.pdf -C /tmp/unpacked-web
          bin/fill-pdf /tmp/unpacked-web/formulaire.toml --dry-run

      - name: Keep traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          if-no-files-found: ignore
