# Form description — template.
#
# Copy this file NEXT TO THE PDF it fills, rename it, and adapt it. It
# describes WHERE to put WHAT, so it carries the real values — a name, a date
# of birth, an address — and must never be committed to a repository.
#
# Run:  fill-pdf my-form.toml --dry-run     (check without writing)
#       fill-pdf my-form.toml
#
# The web app reads and writes this same format: point it at the PDF and the
# .toml together and everything falls back into place.

# Paths are relative to THIS FILE's directory, not to the current directory.
source = "blank-form.pdf"
output = "filled-form.pdf"

[style]
ink  = [0.05, 0.15, 0.7]   # RGB from 0 to 1 — ink blue
font = "helv"              # PyMuPDF base-14 name: helv, tiro, cour, tibo…
size = 10                  # ink, font and size are all overridable entry by entry
# font = "Homemade Apple"           # …or any font, from a file living next
# fontfile = "homemade-apple.woff"  # to this description (TTF, OTF or WOFF)

# Entries paint in layers: images at the bottom, then check marks, then text —
# a signature scan's opaque background cannot eat the name written next to it.
# An optional  z = <integer>  on any entry overrides that order: higher paints
# later, i.e. on top. The web app writes it for you when you reorder its list.

# --- Text -------------------------------------------------------------------
# page is 1-INDEXED: the first page of the PDF is numbered 1, as in a viewer.
# The origin (x=0, y=0) is the TOP left corner, and y is the text baseline —
# not its top.

[[text]]
page = 1
x = 75
y = 230
size = 11
text = "DOE"
note = "Last name"  # free field, ignored by the tool: there to re-read yourself

[[text]]
page = 1
x = 75
y = 277
size = 11
text = "Alex"
note = "First name"
# ink = [0.8, 0, 0]                 # this one entry in red
# font = "Homemade Apple"           # a signature wants a handwriting font;
# fontfile = "homemade-apple.woff"  # font and fontfile work per entry too

# --- Check marks ------------------------------------------------------------
# A cross laid down like text: these forms have no real fields.

[[check]]
page = 1
x = 96
y = 332
size = 11
note = "Ms. checkbox"
# mark = "X"        # uncomment for a different mark
# mark = "3"        # with font = "zadb" (ZapfDingbats): a real glyph —
# font = "zadb"     # "3" ✓, "7" ✗, "l" a filled dot

# --- Images -----------------------------------------------------------------
# rect = [x0, y0, x1, y1], top left corner then bottom right corner.

[[image]]
page = 2
rect = [395, 395, 525, 435]
file = "signature.png"
note = "Signature"
# keep_proportion = true
# z = 9             # force this image ABOVE the text layers
